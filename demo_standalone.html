function overview(){const filtered=DB.companies.filter(c=>(state.stage==='all'||c.level===state.stage||(c.extraLevels||[]).includes(state.stage))&&(state.market==='all'||c.market===state.market)&&`${c.name} ${c.ticker} ${c.role}`.toLowerCase().includes(state.search.toLowerCase()));return `${header('INDUSTRY INTELLIGENCE / 01','看见产业链，更要看见证据','把光芯片、器件、光模块到AI网络需求连成一条可核验链路。点击环节或公司，查看真实业务证据，不以概念标签代替事实。')}

<div class="panel">${sectionTitle('光互联产业链地图','按交付功能分层，跨层公司允许多重归属。主层根据已披露的主要产品收入或业务角色确定。',`<button class="button outline small" id="showTaxonomy">分类口径 ↗</button>`)}<div class="chain">${DB.classification.levels.map(l=>`<button class="chain-card ${state.stage===l.id?'active':''}" data-stage="${esc(l.id)}"><div class="chain-num">${esc(l.name.split(' · ')[0])} / ${esc(l.short.split(' / ')[0])}</div><h3>${esc(l.name.split(' · ')[1])}</h3><div class="chain-short">${esc(l.short)}</div><div class="chain-metric">关键指标：${esc(l.metric)}</div></button>`).join('')}</div><div class="row-between" style="margin-top:15px"><span class="tagline">链路：基础技术 → 光器件 → 光模块 → AI集群需求（价值流与订单方向可能相反）</span><button class="link-button" id="clearStage">${state.stage==='all'?'查看全部环节':'× 清除环节筛选'}</button></div></div>
<div class="panel">${sectionTitle('产业链公司关系矩阵',`显示 ${filtered.length} 家公司 · 产品收入与分部收入均标明原始单位和报告期`)}<div class="toolbar"><input id="companySearch" class="input search" placeholder="搜索公司 / 股票代码 / 业务关键词" value="${esc(state.search)}" aria-label="搜索公司"><select id="marketFilter" class="select"><option value="all">全部市场</option><option value="A股" ${state.market==='A股'?'selected':''}>A股</option><option value="美股" ${state.market==='美股'?'selected':''}>美股</option></select><span class="tiny-pill">${esc(state.stage==='all'?'全链条':DB.classification.levels.find(x=>x.id===state.stage)?.short)}</span></div><div id="companyRows">${companyRows(filtered)}</div></div>

function claims(){let list=DB.claims.filter(x=>(state.grade==='all'||x.level===state.grade)&&`${C(x.company)?.name||''} ${x.topic} ${x.title}`.toLowerCase().includes(state.claimSearch.toLowerCase()));return `${header('EVIDENCE ENGINE / 02','概念关系，按证据而不是热度排序','同一家公司可同时拥有“有收入的业务”和“只有研发计划的概念”。A–E评级针对具体主张，而非对公司的总体打分。')}

<div class="panel">${sectionTitle('证据核验列表',`当前 ${list.length} 条具体概念主张 / ${DB.claims.length} 条总主张`)}<div class="toolbar"><input class="input search" id="claimSearch" placeholder="搜索概念 / 公司 / 主张" value="${esc(state.claimSearch)}"><select class="select" id="gradeFilter"><option value="all">全部证据等级</option>${Object.keys(gradeLabel).map(g=>`<option value="${g}" ${state.grade===g?'selected':''}>${esc(gradeLabel[g])}</option>`).join('')}</select><button class="button primary small" id="addEvidenceHere">+ 提交新证据</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>公司 / 概念</th><th>可验证的具体主张</th><th>可信度</th><th>收入 / 数量口径</th><th>核验状态</th><th>来源</th></tr></thead><tbody>${list.map(x=>`<tr><td><b>${esc(C(x.company)?.name||x.company)}</b><div class="ticker">${esc(x.topic)}</div></td><td><button class="link-button claim-title" data-claim="${esc(x.id)}">${esc(x.title)} ↗</button><div class="detail-note">${esc(x.explanation)}</div></td><td>${pill(x.level)}</td><td class="metric-number">${esc(x.amount)}</td><td>${x.status==='verified'?'<span class="verification">✓ 已核验公开披露</span>':'<span class="verification pending">待人工复核</span>'}</td><td>${x.evidence.map(sourceLink).join('<div style="height:4px"></div>')}</td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty">没有匹配主张</div>':''}</div></div><div class="notice">特别说明：E级“证据缺失”不等于证明公司不经营该业务；不能因“仅表态”就断言虚假，也不能把预测、订单、研发计划直接写作收入。</div>`}
function peers(){let cp=DB.comparisons.find(p=>`${p.a}|${p.b}`===state.peer)||DB.comparisons[0];let a=C(cp.a),b=C(cp.b);return `${header('GLOBAL PEER MAP / 03','为何可比，哪里不可比','以“产品重叠 × 需求驱动 × 披露可比性”为定性评分框架。评分只是研究优先级，不是估值或股价判断。')}

<div class="panel"><div class="row-between" style="margin-bottom:16px"><div><div class="eyelabel">BUSINESS COMPARABILITY</div><h2 style="margin:8px 0;font-size:18px">跨市场可比性画像</h2></div><div style="text-align:right"><div class="score">${cp.score}<span style="font-size:12px;color:#9eb0b8"> / 100</span></div><div class="muted" style="font-size:10px">定性匹配分 · 非量化估值</div></div></div><div class="peer-hero"><div class="peer-person"><span class="badge market">${esc(a.market)}</span><h3>${esc(a.name)}</h3><p>${esc(a.ticker)}</p><p style="margin-top:10px"><strong>${esc(a.revenueLabel)}</strong> / ${esc(a.period)}</p></div><div class="peer-line">⇄</div><div class="peer-person"><span class="badge market">${esc(b.market)}</span><h3>${esc(b.name)}</h3><p>${esc(b.ticker)}</p><p style="margin-top:10px"><strong>${esc(b.revenueLabel)}</strong> / ${esc(b.period)}</p></div></div><div class="compare-cols"><div class="compare-card"><h4>✓ 可以比较的部分</h4><ul>${cp.why.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="compare-card warnings"><h4>! 不可直接比较 / 需调整</h4><ul>${cp.not.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div><hr class="mini-divider"><div class="sources-foot"><div class="tagline">两端数据源：${cp.sources.map(sourceLink).join(' · ')}</div><button class="button outline small" data-company="${esc(a.id)}">查看中国/上游公司画像 ↗</button></div></div><div class="notice">方法：评分基于产品重叠（40分）、需求驱动（25分）、业务模式（20分）、披露可比性（15分）的人工定性判断。缺少统一AI收入、相同会计区间与同币种时，不展示虚假的数值相对估值。</div>`}
function impact(){let ev=DB.events.find(x=>x.id===state.event)||DB.events[0];return `${header('TRANSMISSION LAB / 04','外部变量如何走进公司财报','从事件到需求、供给、具体业务与财务科目。推演只给方向、机制和验证指标，不虚构财务敏感度与收益率。')}
<div class="panel">${sectionTitle('选择外部冲击情景','所有事件均为条件式研究情景，不代表已经发生。')}<div class="event-options">${DB.events.map(e=>`<button class="event-card ${state.event===e.id?'selected':''}" data-event="${esc(e.id)}"><div class="eyelabel">${esc(e.kind)}</div><h3>${esc(e.name)} →</h3><p>${esc(e.detail)}</p></button>`).join('')}</div></div><div class="two-col"><div class="panel">${sectionTitle('事件 → 环节 → 公司 → 财务','每个箭头都有前提；方向可能被价格、份额、客户结构逆转。',`<span class="badge c">${esc(ev.status)}</span>`)}<div class="path-list">${ev.paths.map((p,i)=>`<div class="path-item"><div class="path-left"><span class="path-step">${i+1}</span>${i===ev.paths.length-1?'':'<span class="path-connector"></span>'}</div><div class="path-content"><b>${esc(p.from)} <span style="color:#1a8b7d">→</span> ${esc(p.to)}</b><p>传导条件：${esc(p.strength)}</p></div></div>`).join('')}</div><div class="insight"><div class="insight-icon">⚑</div><div><h4>为什么不能直接推算股价？</h4><p>${esc(ev.caveat)}</p></div></div></div><div><div class="panel">${sectionTitle('受影响公司 · 需进一步核验')}<div class="chip-wrap">${ev.affected.map(id=>`<button class="pill-toggle" data-company="${esc(id)}">${esc(C(id).name)} ↗</button>`).join('')}</div><h4 style="font-size:12px;margin:23px 0 10px">财报中应验证</h4><div class="signal-list">${ev.observe.map(x=>`<div class="signal"><span class="signal-bullet">•</span><span>${esc(x)}</span></div>`).join('')}</div><p class="timeline" style="margin-top:14px">情景支撑材料：${sourceLink(ev.source)}</p></div><div class="panel">${sectionTitle('研究强度切换','仅改变关注优先级，不按比例臆造利润增速。')}<div class="select-row">${[['low','保守'],['medium','基准'],['high','进取']].map(([v,l])=>`<button class="pill-toggle ${state.intensity===v?'active':''}" data-intensity="${v}">${l}</button>`).join('')}</div><p class="tagline" style="line-height:1.9;margin-top:13px">${state.intensity==='low'?'保守：先查订单和产能约束，不确认终端投资能否转为采购。':state.intensity==='medium'?'基准：先确认业务量增长，再核对ASP和毛利率，区分需求放量和价格变化。':'进取：研究产品代际升级、供给约束、规模效应，但须追加验证良率与客户份额。'}</p></div></div></div><div class="notice">情景来源说明：${sourceLink(ev.source)}。情景和具体公司的敏感度均为分析假设；尚未接入实时价格、公告自动监测与定量模型。</div>`}

view">填写并点击“证据预审”，系统将建议 A-E 证据等级；无论评级如何，新增资料均须人工核验原文。</div></div><div class="field full"><button class="button primary w-full" type="submit">提交预审并加入待复核队列</button></div></form></div><div class="panel">${sectionTitle('更新与可追踪性')}<p class="tagline" style="line-height:1.9">本版本使用披露资料快照，不声称具备自动抓取最新公告。可通过JSON导入更新候选材料，保留更新日志；外部接入由iFinD MCP / 扶摇数据适配器提供扩展接口。</p><div class="actions"><button id="exportHere" class="button outline small">↧ 导出快照</button><button id="resetCustom" class="button outline small">清空自定义证据</button></div><hr class="mini-divider"><div class="section-label">最近更新日志</div>${(DB.log||[]).slice(0,5).map(l=>`<p class="timeline">${esc(l.at)} · ${esc(l.action)}</p>`).join('')||'<p class="timeline">当前暂无用户新增资料</p>'}</div></div></div>`}
function copilot(){if(!state.chat.length)state.chat=[{role:'assistant',text:'你好。我优先引用来源编号，不凭空生成收入或目标价。你可以问我：\n「新易盛 CPO 有真实收入吗？」\n「中际旭创和 Coherent 为什么不能直接比？」\n「海外 AI 投资上修如何传导？」',citations:[],method:'欢迎使用 · 引用优先'}];return `${header('RESEARCH COPILOT / 05','会说“不确定”的 AI 助研','本地检索可离线使用；若服务器配置 OPENAI_API_KEY，可启用受证据约束的语言模型生成。所有AI输出都需要回到证据核验。')}

<div class="suggestions">${['新易盛CPO有收入吗？','中际旭创和Coherent怎么比？','海外AI资本开支上修影响谁？','天孚通信是不是光模块公司？'].map(t=>`<button data-ask="${esc(t)}">${esc(t)}</button>`).join('')}</div><div id="chatWindow" class="chat-window">${state.chat.map(m=>chatBubble(m)).join('')}</div><form id="chatForm" class="chat-composer"><input name="query" class="input" maxlength="280" required placeholder="输入产业链、公司、CPO、同业比较或事件问题…" aria-label="研究问题"><button type="submit" class="button primary">发送 ↗</button></form></div><div><div class="panel">${sectionTitle('AI 的角色与约束')}<div class="signal-list"><div class="signal"><span class="signal-bullet">01</span><div><b>检索与证据对齐</b><br>只使用已纳入证据库的公司、主张和材料。</div></div><div class="signal"><span class="signal-bullet">02</span><div><b>口径冲突提示</b><br>自动提示“跨财年 / 跨币种 / 产品与分部混合”。</div></div><div class="signal"><span class="signal-bullet">03</span><div><b>保留不确定性</b><br>无产品收入时输出“未单列”而非猜测数值。</div></div><div class="signal"><span class="signal-bullet">04</span><div><b>人审优先</b><br>新增材料需要复核；模型不是事实认证机构。</div></div></div></div><div class="panel">${sectionTitle('合规防线')}<p class="tagline" style="line-height:1.8">不输出个股买卖指令、保证收益、未证实客户名单、自动目标价或编造的市场实时数据。涉及未来订单、收入弹性或股价的结论都需注明“假设”。</p><button class="button outline small" data-view="claims">查看证据等级规则 →</button></div></div></div>`}
function chatBubble(m){return `<div class="chat-msg ${esc(m.role)}">${m.role==='assistant'?`<div class="chat-meta">${esc(m.method||'证据检索')}</div>`:''}${esc(m.text)}${m.citations?.length?`<div class="chat-citations">${m.citations.filter(id=>A(id)).map(sourceLink).join('')}</div>`:''}</div>`}
function showCompany(id){const c=C(id);if(!c)return;const claim=DB.claims.filter(x=>x.company===id);showModal(`<div class="eyebrow">COMPANY PROFILE / 业务归属</div><h2>${esc(c.name)} <span class="badge market">${esc(c.market)}</span></h2><div class="meta">${esc(c.ticker)} · 主层：${esc(DB.classification.levels.find(l=>l.id===c.level)?.name)} · ${esc(c.period)}</div><p>${esc(c.role)}。${esc(c.headline)}。</p><div class="kv"><dt>已核验收入口径</dt><dd><b>${esc(c.revenueLabel)}</b></dd><dt>统计分母</dt><dd>${esc(c.denominator)}</dd><dt>财务指标</dt><dd>${esc(c.finance)}</dd><dt>机会因素</dt><dd>${esc(c.opportunity)}</dd><dt>风险变量</dt><dd>${esc(c.risk)}</dd></div><h3>分概念判断（不是公司综合评级）</h3>${claim.map(x=>`<div class="source-card"><div class="row-between"><b>${esc(x.topic)}</b>${pill(x.level)}</div><p>${esc(x.title)}。${esc(x.explanation)}</p><div class="sources-foot">${x.evidence.map(sourceLink).join(' ')}</div></div>`).join('')}<h3>数据原始出处</h3><div class="modal-sources">${[...new Set(c.evidence)].map(sourceLink).join(' · ')}</div>`)}
function showClaim(id){const x=DB.claims.find(v=>v.id===id);if(!x)return;showModal(`<div class="eyebrow">CLAIM TRACE / 概念主张</div><h2>${esc(C(x.company)?.name||x.company)} · ${esc(x.topic)}</h2>${pill(x.level)} <span class="verification ${x.status==='verified'?'':'pending'}">${x.status==='verified'?'公开披露已核验':'用户提交待复核'}</span><h3>${esc(x.title)}</h3><p>${esc(x.explanation)}</p><div class="source-excerpt">财务/业务口径：${esc(x.amount)}<br>结论边界：${esc(verdict(x))}</div><h3>溯源与反证路径</h3><p>打开下列原文核对“主体、报告期、产品范围、财务口径”。证据等级用于具体主张，不应扩散为行业或公司全部业务的结论。</p><div class="modal-sources">${x.evidence.map(sourceLink).join('<hr class="mini-divider">')}</div>`)}
function showSource(id){const s=A(id);if(!s)return;showModal(`<div class="eyebrow">ORIGINAL DOCUMENT / 资料溯源</div><h2>${esc(s.id)} · ${esc(s.publisher)}</h2><div class="meta">${esc(s.type)} · 资料日期 ${esc(s.date)} · 数据期 ${esc(s.period)}</div><p><b>对应位置：</b>${esc(s.location)}</p><div class="source-excerpt">${esc(s.excerpt)}</div><p>此处为研究结构化摘要，并非原文整篇转载。点击原文链接，核验上下文与表格分母。</p><div class="row-between">${s.verified?'<span class="verification">✓ 已人工核验基本出处</span>':'<span class="verification pending">待人工复核 · 不进入已确认事实</span>'}${safeURL(s.url)?`<a href="${esc(safeURL(s.url))}" target="_blank" rel="noopener noreferrer" class="button primary">打开原始出处 ↗</a>`:'<span class="muted">没有有效 HTTPS 来源</span>'}</div>`)}
function showModal(html){$('#modalBody').innerHTML=html;$('#modal').hidden=false;document.body.style.overflow='hidden'}
function closeModal(){$('#modal').hidden=true;document.body.style.overflow=''}
function taxonomy(){showModal(`<div class="eyebrow">CLASSIFICATION STANDARD</div><h2>产业链归属口径</h2><p>${esc(DB.classification.standard)}</p>${DB.classification.levels.map(l=>`<div class="source-card"><b>${esc(l.name)}</b><p>${esc(l.detail)}</p><span class="tagline">跟踪指标：${esc(l.metric)}</span></div>`).join('')}<p><b>证据优先级：</b>监管披露/年报 &gt; 公司产品与订单披露 &gt; 经营计划 &gt; 研报和媒体 &gt; 无证据。多层公司不会将全部营收重复分配到每一层。</p>`)}
function gradeEvidence(text,url){const t=text.toLowerCase(),u=safeURL(url);let grade='E',why='无可信资料链接或缺少有效事实，不能验证主张。';const primary=!!u&&/szse.cn|cninfo.com.cn|sse.com.cn|sec.gov|coherent.com|lumentum.com|zj-innolight.com|eoptolink.com|tfc|cnstock.com/.test(new URL(u).hostname);
 if(u&&/(传闻|据传|疑似|网传|股吧|market rumor|social media)/i.test(t)){grade='D';why='内容含传闻词，不能视为公司已披露事实。'}
 else if(primary&&/(营收|营业收入|销售收入|净收入|revenue|recognized revenue)/i.test(t)&&/(元|亿|million|billion|%|万元)/i.test(t)){grade='A';why='疑似一手材料且出现收入与计量口径；仍必须复核具体产品与分母。'}
 else if(primary&&/(量产|批量交付|出货|交付|批量供应|shipment|mass produc)/i.test(t)){grade='B';why='存在交付/商业化描述，未发现可确认的分项收入。'}
 else if(u&&/(研发|计划|拟|探索|布局|推进|investigat|research|plan to|expect to)/i.test(t)){grade='C';why='仅有计划或研发信息，不能将其升级为收入或订单。'}
 else if(u){grade='D';why='有资料链接，但缺乏明确的收入/交付证据或非可靠一手来源。'}
 return {grade,why,primary};}
function addEvidence(form){const d=new FormData(form);const company=String(d.get('company')||''),topic=String(d.get('topic')||'').trim(),url=String(d.get('url')||'').trim(),excerpt=String(d.get('excerpt')||'').trim(),notes=String(d.get('notes')||'').trim();if(!C(company)||!topic||excerpt.length<12){notify('请填写公司、概念与至少12字的证据内容');return}if(url&&!safeURL(url)){notify('资料链接仅支持HTTPS；可留空并标为无证据');return}if(excerpt.length>1700||topic.length>65){notify('内容超出长度限制');return}const r=gradeEvidence(excerpt,url);const suffix=(Date.now().toString(36)+Math.random().toString(36).slice(2,5)).toUpperCase();const sid='U'+suffix,cid='UC'+suffix;DB.sources.unshift({id:sid,type:'用户提交',publisher:C(company).name,date:new Date().toISOString().slice(0,10),period:'待补充',location:notes||'用户自行提交的摘要',url,excerpt,verified:false,custom:true});DB.claims.unshift({id:cid,company,topic,level:r.grade,title:topic+'：用户提交材料待复核',evidence:[sid],explanation:`规则预审：${r.why}评级仅为审核建议。`,amount:'未核实财务数字',status:'pending',custom:true});(DB.log=DB.log||[]).unshift({at:fmtDate(),action:`新增 ${C(company).name}/${topic} 候选证据 (${r.grade}级建议)`});save();render();notify(`预审为 ${r.grade} 级；已进入待人工复核队列`);showSource(sid);}
function downloadJSON(){const content=JSON.stringify({...DB,exportedAt:new Date().toISOString()},null,2);const blob=new Blob([content],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='opticscope-research-snapshot.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('研究快照已导出（含待复核标记）')}
async function importJSON(file){if(!file)return;if(file.size>1024*1024){notify('导入失败：JSON不得超过1MB');return}try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.sources)||!Array.isArray(obj.claims)||obj.schemaVersion!==1)throw Error('版本或字段不兼容');let count=0;const sourceIds=new Set(DB.sources.map(x=>x.id));for(const s of obj.sources){if(s&&s.custom===true&&typeof s.id==='string'&&!sourceIds.has(s.id)&&typeof s.excerpt==='string'&&s.excerpt.length<=1700&&(!s.url||safeURL(s.url))){DB.sources.push({...s,verified:false,custom:true});sourceIds.add(s.id);count++}}for(const c of obj.claims){if(c&&c.custom===true&&typeof c.id==='string'&&C(c.company)&&Array.isArray(c.evidence)&&c.evidence.every(id=>sourceIds.has(id))&&!DB.claims.find(x=>x.id===c.id)){DB.claims.push({...c,status:'pending',custom:true,level:['A','B','C','D','E'].includes(c.level)?c.level:'E'})}}(DB.log=DB.log||[]).unshift({at:fmtDate(),action:`JSON导入 ${count} 条候选资料`});save();render();notify(`导入完成：${count} 条未复核来源`)}catch(e){notify('导入失败：'+e.message)}}
function localAnswer(q){const query=q.toLowerCase();if(/(买|卖|目标价|推荐股票|保证收益|内幕|明天涨|交易信号)/.test(query))return{text:'我可以核验公司业务和研究风险，但不能根据这些静态资料给出具体买卖指令、保证收益或未经证实的交易信号。请先查看业务主张及财务披露。',citations:[],method:'合规约束 · 本地检索'};
if(/cpo/.test(query)&&/(新易盛|300502)/.test(query))return{text:'新易盛确实处于光互联产业链。2025年年报的“光互联产品”收入为247.71亿元（A级业务关系），但CPO在所引经营计划中属于研发与产业化推进表述（C级）。因此不能说已有经核实的CPO规模收入。',citations:['S02','S06'],method:'证据对齐 · 本地检索'};
if(/中际|coherent|可比|对比|海外/.test(query)&&/比|比较|可比|同业/.test(query)){const comp=DB.comparisons[0];return{text:'中际旭创和Coherent都覆盖高速光互联应用，因此适合做产业需求与技术路线对照。但中际所列为FY2025光通信收发模块产品收入，而Coherent为截至2026年6月的Datacenter & Communications分部收入，包含通信业务。币种、财年、产品口径均不同，不能直接据此比较市场份额或估值。',citations:comp.sources,method:'跨市场口径核对 · 本地检索'};}
if(/天孚|300394/.test(query))return{text:'天孚通信是光器件/组件供应商，而不是应与成品模块厂商直接等同的业务口径。2025年有源光器件收入约29.98亿元、无源光器件约20.84亿元。其与中际、新易盛属于上下游/交叉的技术链条，毛利率不能简单横比。',citations:['S03'],method:'产业层级定位 · 本地检索'};
if(/资本开支|capex|传导|投资|需求|供需|政策|关税|贸易|cpo架构/.test(query))return{text:'条件式传导：海外AI网络投资增加 → 数据中心交换和互联端口需求变化 → 高速光模块订单/产品结构变化 → 上游光器件和光源采购 → 公司收入、毛利率、存货与研发资本开支。行业预测不能替代公司的已确认订单；还需要逐项验证采购架构、产品ASP、良率、客户份额和时间滞后。贸易政策冲击则优先关注海外交付与原材料成本。',citations:['S08','S09'],method:'传导路径 · 本地检索'};
const hit=DB.claims.filter(x=>`${C(x.company)?.name||''} ${x.topic} ${x.title}`.toLowerCase().includes(query)||query.includes((C(x.company)?.name||'').toLowerCase())||query.includes(x.topic.toLowerCase())).slice(0,2);if(hit.length)return{text:hit.map(x=>`${C(x.company)?.name}「${x.topic}」：${x.title}（${x.level}级）。${x.explanation}`).join('\n')+'\n如果想要确认产品收入，请打开对应S编号原始报告并核对统计分母。',citations:[...new Set(hit.flatMap(x=>x.evidence))],method:'关键词检索 · 本地证据库'};
return{text:'在现有静态证据库中，没有检索到足够证据支持这一具体判断。我不会补造数据或引用。可进入「证据库与更新」添加公告原文，提交为待复核证据，或将问题限定为现有五家公司。',citations:[],method:'证据不足 · 本地检索'};}
async function ask(q){state.chat.push({role:'user',text:q});state.chat.push({role:'assistant',text:'正在检索证据…',method:'处理请求',citations:[]});render();const container=$('#chatWindow');container?.scrollTo(0,container.scrollHeight);const fallback=localAnswer(q);let result=fallback;try{const response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q}),signal:AbortSignal.timeout(8000)});if(response.ok){const o=await response.json();if(o && typeof o.answer==='string'&&o.answer.length<2500 && Array.isArray(o.citations))result={text:o.answer,method:o.method||'AI 核验辅助',citations:o.citations.filter(id=>A(id))}}}catch{}state.chat.pop();state.chat.push({role:'assistant',...result});if(state.view==='copilot'){render();const win=$('#chatWindow');win?.scrollTo(0,win.scrollHeight)}}
function wireView(){if(state.view==='copilot'){$('#chatWindow')?.scrollTo(0,$('#chatWindow').scrollHeight)}}
function handleClick(e){const target=e.target.closest('button');if(!target)return;const d=target.dataset;if(d.view){nav(d.view);return}if(d.company){showCompany(d.company);return}if(d.claim){showClaim(d.claim);return}if(d.source){showSource(d.source);return}if(d.stage){state.stage=d.stage===state.stage?'all':d.stage;render();return}if(d.peer){state.peer=d.peer;render();return}if(d.event){state.event=d.event;render();return}if(d.intensity){state.intensity=d.intensity;render();return}if(d.ask){ask(d.ask);return}if(target.id==='showTaxonomy'){taxonomy();return}if(target.id==='clearStage'){state.stage='all';render();return}if(target.id==='exportBtn'||target.id==='exportHere'){downloadJSON();return}if(target.id==='addEvidenceGlobal'||target.id==='addEvidenceHere'){nav('sources');setTimeout(()=>$('#evidenceFormPanel')?.scrollIntoView({behavior:'smooth',block:'start'}),10);return}if(target.id==='importBtn'){$('#importInput').click();return}if(target.id==='resetCustom'){if(!confirm('只清除本浏览器的用户新增待复核证据，保留官方种子资料。继续？'))return;DB.sources=DB.sources.filter(x=>!x.custom);DB.claims=DB.claims.filter(x=>!x.custom);DB.log=[];save();render();notify('已清除用户自定义证据');return}}
function handleChange(e){const t=e.target;if(t.id==='companySearch'){state.search=t.value;render()}if(t.id==='marketFilter'){state.market=t.value;render()}if(t.id==='claimSearch'){state.claimSearch=t.value;render()}if(t.id==='gradeFilter'){state.grade=t.value;render()}if(t.id==='sourceSearch'){state.sourceSearch=t.value;render()}if(t.id==='importInput'){importJSON(t.files[0]);t.value=''}}
function handleSubmit(e){if(e.target.id==='evidenceForm'){e.preventDefault();addEvidence(e.target)}if(e.target.id==='chatForm'){e.preventDefault();const q=String(new FormData(e.target).get('query')||'').trim();if(q){e.target.reset();ask(q)}}}
async function init(){try{const embedded=$('#seed-data')?.textContent;if(embedded){DB=JSON.parse(embedded)}else{const response=await fetch('data/seed.json');if(!response.ok)throw Error('HTTP '+response.status);DB=await response.json()}restore();const hash=location.hash.slice(1);state.view=['overview','claims','peers','impact','copilot','sources'].includes(hash)?hash:'overview';document.addEventListener('click',handleClick);document.addEventListener('change',handleChange);document.addEventListener('submit',handleSubmit);document.addEventListener('input',e=>{if(['companySearch','claimSearch','sourceSearch'].includes(e.target.id)){const id=e.target.id,v=e.target.value,key=id==='companySearch'?'search':id==='claimSearch'?'claimSearch':'sourceSearch';state[key]=v;const cursor=e.target.selectionStart;render();const n=$('#'+id);n?.focus();n?.setSelectionRange(cursor,cursor)}});$('#closeModal').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v!==state.view)nav(v)});$$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===state.view));render()}catch(err){$('#app').innerHTML=`<div class="panel"><h2>无法加载静态资料</h2><p>请使用 npm start 或 python -m http.server 启动服务后访问，而非直接用 file:// 打开。</p><code>${esc(err.message)}</code></div>`}}
init();
// Export selected pure helpers for Node tests without side effects via CommonJS mock environment.
if(typeof module!=='undefined'&&module.exports) module.exports={esc,safeURL,gradeEvidence,localAnswer};
